<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广告数据 - 亚马逊广告AI专家</title>
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --bg-dark: #f5f6fa;
      --bg-card: #ffffff;
      --bg-input: #f3f4f6;
      --text-primary: #1a1d26;
      --text-secondary: #6b7280;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #e5e7eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
    }
    .layout { display: flex; min-height: 100vh; }
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h2 .icon { font-size: 24px; }

    /* 工具栏 */
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .filter-group label { color: var(--text-secondary); white-space: nowrap; }
    .filter-group input,
    .filter-group select {
      padding: 6px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .filter-group input[type="date"] { min-width: 130px; }
    .filter-group select { min-width: 140px; }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 5px 10px;
      font-size: 12px;
    }
    .btn-outline:hover { background: rgba(102,126,234,0.06); }
    .btn-link {
      background: transparent;
      border: none;
      color: var(--primary);
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .btn-link:hover { color: var(--primary-dark); }

    /* 汇总卡片 */
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 18px 20px;
      border: 1px solid var(--border);
    }
    .summary-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .summary-card .value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }
    .summary-card .value.success { color: var(--success); }
    .summary-card .value.warning { color: var(--warning); }
    .summary-card .value.danger  { color: var(--danger); }
    .summary-card .sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* 数据表格 */
    .card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header h3 { font-size: 15px; font-weight: 600; }
    .table-wrapper { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody td {
      padding: 13px 16px;
      font-size: 13px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }
    tbody tr:hover { background: #fafbff; cursor: pointer; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.expanded { background: #f0f1ff; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      gap: 4px;
    }
    .status-badge.enabled  { background: rgba(16,185,129,0.1); color: var(--success); }
    .status-badge.paused    { background: rgba(245,158,11,0.1);  color: var(--warning); }
    .status-badge.archived  { background: rgba(107,114,128,0.1); color: var(--text-secondary); }
    .status-badge.SP { background: rgba(102,126,234,0.1); color: var(--primary); }
    .status-badge.SB { background: rgba(16,185,129,0.1); color: var(--success); }
    .status-badge.SD { background: rgba(245,158,11,0.1); color: var(--warning); }

    .metric { font-weight: 600; }
    .metric.acos-green { color: var(--success); }
    .metric.acos-warn  { color: var(--warning); }
    .metric.acos-bad   { color: var(--danger); }

    /* 分页 */
    .pagination {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }
    .pagination-info { font-size: 12px; }
    .pagination-btns { display: flex; gap: 6px; }
    .pagination-btns button {
      padding: 5px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .pagination-btns button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .pagination-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 加载状态 */
    .loading-mask {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--text-secondary);
      font-size: 14px;
      gap: 10px;
    }
    .loading-mask .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      padding: 48px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* 弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: #fff;
      border-radius: 14px;
      width: 860px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.22s ease;
      overflow: hidden;
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .modal-title .type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(102,126,234,0.1);
      color: var(--primary);
      font-weight: 600;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
      padding: 4px;
    }
    .modal-close:hover { color: var(--text-primary); }
    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 详情概览 */
    .detail-kpis {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-kpi {
      background: #f9fafb;
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }
    .detail-kpi .k-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
    .detail-kpi .k-value { font-size: 18px; font-weight: 700; }

    /* 子表格 */
    .sub-table-title {
      font-size: 13px;
      font-weight: 600;
      margin: 16px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sub-table-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 图表区 */
    .chart-area {
      background: #fafbfc;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0 16px;
      border: 1px solid var(--border);
    }
    .chart-area canvas { display: block; }

    /* 工具提示 */
    .lx-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid rgba(102,126,234,0.3);
      border-radius: 5px;
      text-decoration: none;
      background: rgba(102,126,234,0.04);
    }
    .lx-link:hover { background: rgba(102,126,234,0.1); }

    @media (max-width: 900px) {
      .summary-cards { grid-template-columns: repeat(3, 1fr); }
      .detail-kpis { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<div class="layout">
  <div id="sidebar"></div>
  <main class="main">
    <!-- 顶部 -->
    <div class="header">
      <h2><span class="icon">📺</span> 广告数据</h2>
      <button class="btn btn-primary" onclick="syncData()">
        🔄 同步数据
      </button>
    </div>

    <!-- 筛选栏 -->
    <div class="toolbar">
      <div class="filter-group">
        <label>店铺</label>
        <select id="filterStore" onchange="loadPortfolios()">
          <option value="">全部店铺</option>
        </select>
      </div>
      <div class="filter-group">
        <label>开始日期</label>
        <input type="date" id="filterStart" onchange="loadPortfolios()" />
      </div>
      <div class="filter-group">
        <label>结束日期</label>
        <input type="date" id="filterEnd" onchange="loadPortfolios()" />
      </div>
      <div class="filter-group" style="margin-left:auto; background:transparent; border:none; padding:0;">
        <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
      </div>
    </div>

    <!-- 汇总卡片 -->
    <div class="summary-cards" id="summaryCards">
      <div class="summary-card">
        <div class="label">广告活动</div>
        <div class="value" id="s-total">—</div>
        <div class="sub">个</div>
      </div>
      <div class="summary-card">
        <div class="label">展示量</div>
        <div class="value" id="s-impressions">—</div>
        <div class="sub">次</div>
      </div>
      <div class="summary-card">
        <div class="label">点击量</div>
        <div class="value" id="s-clicks">—</div>
        <div class="sub">次</div>
      </div>
      <div class="summary-card">
        <div class="label">广告花费</div>
        <div class="value" id="s-cost">—</div>
        <div class="sub" id="s-cpc">—</div>
      </div>
      <div class="summary-card">
        <div class="label">销售额</div>
        <div class="value success" id="s-sales">—</div>
        <div class="sub" id="s-roas">—</div>
      </div>
      <div class="summary-card">
        <div class="label">平均ACOS</div>
        <div class="value" id="s-acos">—</div>
        <div class="sub">目标: 25%</div>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="card">
      <div class="card-header">
        <h3>📊 广告活动明细</h3>
        <span id="tableCount" style="font-size:12px;color:var(--text-secondary)"></span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>广告活动</th>
              <th>类型</th>
              <th>状态</th>
              <th>展示</th>
              <th>点击</th>
              <th>CTR</th>
              <th>CPC</th>
              <th>花费</th>
              <th>销售额</th>
              <th>ACOS</th>
              <th>ROAS</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="12"><div class="loading-mask"><div class="spinner"></div>加载中…</div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination" style="display:none;">
        <div class="pagination-info" id="paginationInfo"></div>
        <div class="pagination-btns">
          <button id="prevBtn" onclick="changePage(-1)">上一页</button>
          <button id="nextBtn" onclick="changePage(1)">下一页</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <span id="modalTitle">广告活动详情</span>
        <span class="type-badge" id="modalType"></span>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- 动态内容 -->
    </div>
    <div class="modal-footer">
      <a id="modalLxLink" href="#" target="_blank" class="lx-link" style="margin-right:auto;">
        🔗 跳转领星查看
      </a>
      <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script src="components/sidebar.js"></script>
<script>
const API = '/api/lingxing';
let state = {
  list: [],
  summary: {},
  total: 0,
  page: 1,
  pageSize: 15,
  stores: [],
};

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', () => {
  // 默认日期：最近30天
  const end   = new Date();
  const start = new Date();
  start.setDate(end.getDate() - 29);
  document.getElementById('filterEnd').value   = fmtDate(end);
  document.getElementById('filterStart').value  = fmtDate(start);

  loadStores();
  loadPortfolios();
});

// ============ 加载店铺列表 ============
async function loadStores() {
  try {
    const res = await fetch(`${API}/stores`);
    const json = await res.json();
    if (!json.success) return;
    state.stores = json.data;
    const sel = document.getElementById('filterStore');
    sel.innerHTML = '<option value="">全部店铺</option>';
    state.stores.forEach(s => {
      sel.innerHTML += `<option value="${s.store_id}">${s.store_name}</option>`;
    });
  } catch (e) {
    console.error('加载店铺失败', e);
  }
}

// ============ 加载广告数据 ============
async function loadPortfolios() {
  const storeId  = document.getElementById('filterStore').value;
  const start    = document.getElementById('filterStart').value;
  const end      = document.getElementById('filterEnd').value;

  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="12"><div class="loading-mask"><div class="spinner"></div>加载中…</div></td></tr>';

  try {
    const params = new URLSearchParams({
      page: state.page,
      pageSize: state.pageSize,
    });
    if (storeId) params.set('storeId', storeId);
    if (start)   params.set('startDate', start);
    if (end)     params.set('endDate', end);

    const res  = await fetch(`${API}/portfolios?${params}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.message);

    state.list    = json.data;
    state.summary = json.summary;
    state.total   = json.total;

    renderSummary();
    renderTable();
    renderPagination();
  } catch (e) {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="12"><div class="empty-state">❌ 加载失败: ${e.message}</div></td></tr>`;
  }
}

// ============ 渲染汇总 ============
function renderSummary() {
  const s = state.summary;
  document.getElementById('s-total').textContent       = s.total || 0;
  document.getElementById('s-impressions').textContent = fmtNum(s.impressions);
  document.getElementById('s-clicks').textContent      = fmtNum(s.clicks);
  document.getElementById('s-cost').textContent        = '¥' + fmtMoney(s.cost);
  document.getElementById('s-cpc').textContent         = 'CPC ¥' + (s.cpc || 0);
  document.getElementById('s-sales').textContent       = '¥' + fmtMoney(s.sales);
  document.getElementById('s-roas').textContent        = 'ROAS ' + (s.roas || 0) + 'x';
  const acosEl = document.getElementById('s-acos');
  acosEl.textContent = (s.acos || 0) + '%';
  acosEl.className = 'value ' + acosColor(s.acos);
}

// ============ 渲染表格 ============
function renderTable() {
  const tbody = document.getElementById('tableBody');
  if (!state.list.length) {
    tbody.innerHTML = '<tr><td colspan="12"><div class="empty-state">暂无数据，请检查筛选条件或同步数据</div></td></tr>';
    document.getElementById('tableCount').textContent = '';
    return;
  }
  document.getElementById('tableCount').textContent = `共 ${state.total} 条`;

  tbody.innerHTML = state.list.map(item => {
    const acos = item.acos || 0;
    return `
    <tr onclick="openDetail('${item.campaign_id}')" title="点击查看详情">
      <td>
        <div style="font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
          ${item.campaign_name}
        </div>
        <div style="font-size:11px;color:var(--text-secondary);">${item.store_id}</div>
      </td>
      <td><span class="status-badge ${item.type}">${typeLabel(item.type)}</span></td>
      <td><span class="status-badge ${item.status}">${statusLabel(item.status)}</span></td>
      <td>${fmtNum(item.impressions)}</td>
      <td>${fmtNum(item.clicks)}</td>
      <td>${item.ctr}%</td>
      <td>¥${item.cpc}</td>
      <td class="metric">¥${fmtMoney(item.cost)}</td>
      <td class="metric success">¥${fmtMoney(item.sales)}</td>
      <td class="metric ${acosColor(acos)}">${acos}%</td>
      <td>${item.roas}x</td>
      <td onclick="event.stopPropagation()">
        <button class="btn-outline" onclick="openDetail('${item.campaign_id}')">详情</button>
        <a href="${item.lingxing_url}" target="_blank" class="lx-link" style="margin-left:4px;" title="在领星中打开">
          领星 ↗
        </a>
      </td>
    </tr>`;
  }).join('');
}

// ============ 渲染分页 ============
function renderPagination() {
  const totalPages = Math.ceil(state.total / state.pageSize);
  const pagination = document.getElementById('pagination');
  if (totalPages <= 1) { pagination.style.display = 'none'; return; }
  pagination.style.display = 'flex';
  document.getElementById('paginationInfo').textContent =
    `第 ${state.page} / ${totalPages} 页，共 ${state.total} 条`;
  document.getElementById('prevBtn').disabled = state.page <= 1;
  document.getElementById('nextBtn').disabled = state.page >= totalPages;
}

function changePage(delta) {
  const totalPages = Math.ceil(state.total / state.pageSize);
  const next = state.page + delta;
  if (next < 1 || next > totalPages) return;
  state.page = next;
  loadPortfolios();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ 打开详情 ============
async function openDetail(campaignId) {
  const start = document.getElementById('filterStart').value;
  const end   = document.getElementById('filterEnd').value;
  const params = new URLSearchParams();
  if (start) params.set('startDate', start);
  if (end)   params.set('endDate', end);

  try {
    const res  = await fetch(`${API}/portfolios/${campaignId}?${params}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.message);

    const { campaign, adGroups } = json.data;

    document.getElementById('modalTitle').textContent = campaign.campaign_name;
    document.getElementById('modalType').textContent  = typeLabel(campaign.type);
    document.getElementById('modalLxLink').href       = campaign.lingxing_url;

    const s = campaign;
    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <!-- 概览 KPI -->
      <div class="detail-kpis">
        <div class="detail-kpi">
          <div class="k-label">展示量</div>
          <div class="k-value">${fmtNum(s.impressions)}</div>
        </div>
        <div class="detail-kpi">
          <div class="k-label">点击量</div>
          <div class="k-value">${fmtNum(s.clicks)}</div>
        </div>

  } catch (e) {

}

// ============ 详情弹窗趋势图 ============
function drawDetailChart(campaign) {
  const canvas = document.getElementById('detailChart');
  if (!canvas) return;
  const ctx    = canvas.getContext('2d');
  const dpr    = window.devicePixelRatio || 1;
  const w      = canvas.parentElement.clientWidth || 800;
  canvas.width  = w * dpr;
  canvas.height = 180 * dpr;
  ctx.scale(dpr, dpr);

  const daily = campaign.daily || [];
  if (!daily.length) return;

  const days    = daily.length;
  const pad     = { top: 14, right: 20, bottom: 32, left: 52 };
  const cw      = w - pad.left - pad.right;
  const ch      = 180 - pad.top - pad.bottom;

  const costs  = daily.map(d => d.cost);
  const sales  = daily.map(d => d.sales);
  const maxVal = Math.max(...costs, ...sales) * 1.1;
  const minVal = 0;

  // 背景
  ctx.fillStyle = '#fafbfc';
  ctx.fillRect(0, 0, w, 180);

  // 网格
  ctx.strokeStyle = '#f0f1f3';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + cw, y);
    ctx.stroke();
  }

  // Y轴
  ctx.fillStyle = '#9ca3af';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y  = pad.top + (ch / 4) * i;
    const v  = maxVal - (maxVal / 4) * i;
    const label = v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v.toFixed(0);
    ctx.fillText('¥' + label, pad.left - 5, y + 3);
  }

  // X轴标签（每5天）
  ctx.textAlign = 'center';
  daily.forEach((d, i) => {
    if (i % Math.max(1, Math.floor(days / 6)) === 0) {
      const x = pad.left + (cw / (days - 1)) * i;
      ctx.fillText(d.date.slice(5), x, 180 - 10);
    }
  });

  // 花费折线（紫）
  drawLine(ctx, costs, maxVal, pad, cw, ch, '#667eea', daily.length);
  // 销售额折线（绿）
  drawLine(ctx, sales, maxVal, pad, cw, ch, '#10b981', daily.length);

  // 图例
  ctx.fillStyle = '#667eea';
  ctx.fillRect(pad.left, 168, 10, 3);
  ctx.fillStyle = '#6b7280';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('花费', pad.left + 13, 171);

  ctx.fillStyle = '#10b981';
  ctx.fillRect(pad.left + 60, 168, 10, 3);
  ctx.fillStyle = '#6b7280';
  ctx.fillText('销售额', pad.left + 73, 171);
}

function drawLine(ctx, data, maxVal, pad, cw, ch, color, days) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
  grad.addColorStop(0, color + '28');
  grad.addColorStop(1, color + '00');

  const lastX = pad.left + cw;
  const firstX = pad.left;

  ctx.beginPath();
  data.forEach((v, i) => {
    const x = pad.left + (cw / (days - 1)) * i;
    const y = pad.top + ch - (v / maxVal) * ch;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 填充
  ctx.setLineDash([]);
  const lastPtX = pad.left + (cw / (days - 1)) * (data.length - 1);
  ctx.lineTo(lastPtX, pad.top + ch);
  ctx.lineTo(firstX, pad.top + ch);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 数据点
  data.forEach((v, i) => {
    if (i % Math.max(1, Math.floor(days / 8)) !== 0) return;
    const x = pad.left + (cw / (days - 1)) * i;
    const y = pad.top + ch - (v / maxVal) * ch;
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  ctx.restore();
}

// ============ 关闭弹窗 ============
function closeModal() {
  document.getElementById('detailModal').classList.remove('show');
}
document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============ 同步数据 ============
async function syncData() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '🔄 同步中…';
  try {
    const res = await fetch(`${API}/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        startDate: document.getElementById('filterStart').value,
        endDate:   document.getElementById('filterEnd').value,
      })
    });
    const json = await res.json();
    if (json.success) {
      alert('✅ 同步完成，正在刷新…');
      loadPortfolios();
    } else {
      alert('❌ 同步失败: ' + json.message);
    }
  } catch (e) {
    alert('❌ 同步异常: ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = '🔄 同步数据';
}

// ============ 工具函数 ============
function fmtDate(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function fmtNum(n) {
  n = parseInt(n) || 0;
  if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
  return n.toLocaleString();
}

function fmtMoney(v) {
  v = parseFloat(v) || 0;
  if (v >= 10000) return (v / 10000).toFixed(2) + 'w';
  return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function acosColor(v) {
  v = parseFloat(v) || 0;
  if (v <= 20) return 'success';
  if (v <= 30) return 'warning';
  return 'danger';
}

function acosColorHex(v) {
  v = parseFloat(v) || 0;
  if (v <= 20) return '#10b981';
  if (v <= 30) return '#f59e0b';
  return '#ef4444';
}

function typeLabel(t) {
  const m = { SP: 'Sponsored Products', SB: 'Sponsored Brands', SD: 'Sponsored Display' };
  return m[t] || t || '—';
}

function statusLabel(s) {
  const m = { enabled: '投放中', paused: '已暂停', archived: '已归档' };
  return m[s] || s || '—';
}

function resetFilters() {
  document.getElementById('filterStore').value = '';
  const end   = new Date();
  const start = new Date();
  start.setDate(end.getDate() - 29);
  document.getElementById('filterStart').value = fmtDate(start);
  document.getElementById('filterEnd').value   = fmtDate(end);
  state.page = 1;
  loadPortfolios();
}
