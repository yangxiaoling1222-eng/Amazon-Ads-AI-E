<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI指令中心 - 亚马逊广告AI专家</title>
  <script src="js/auth-check.js"></script>
  <!-- SheetJS 库 - 延迟加载，不阻塞页面渲染 -->
  <link rel="preconnect" href="https://cdn.sheetjs.com">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
  <link rel="stylesheet" href="components/task-list.css">
  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --bg-dark: #f5f6fa;
      --bg-card: #ffffff;
      --bg-input: #f3f4f6;
      --text-primary: #1a1d26;
      --text-secondary: #6b7280;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #e5e7eb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .layout {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* 侧边栏样式已由 components/sidebar.js 组件统一提供 */

    /* 主内容区 - 左侧留出侧边栏宽度 */
    .main {
      flex: 1;
      margin-left: 260px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 100vh;
      height: 100vh;
      /* 右侧留出账户面板宽度 */
      margin-right: 240px;
    }

    /* ============ 右侧账户面板 ============ */
    .right-panel {
      width: 240px;
      min-width: 240px;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      z-index: 50;
    }
    .right-panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }
    .right-panel-header .sync-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .right-panel-header .sync-btn:hover {
      background: var(--bg-input);
      color: var(--primary);
    }
    .right-panel-header .sync-btn.spinning {
      animation: spin 1s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .account-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .account-group {
      margin-bottom: 12px;
    }
    .account-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      margin-bottom: 4px;
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      margin-bottom: 4px;
    }
    .account-item:hover {
      background: var(--bg-input);
    }
    .account-item.active {
      background: linear-gradient(135deg, #f0f4ff 0%, #f8f5ff 100%);
      border-color: var(--primary);
    }
    .account-item .account-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .account-item .account-info {
      flex: 1;
      min-width: 0;
    }
    .account-item .account-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-item .account-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .account-item .account-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .account-item.active .account-check {
      background: var(--primary);
      border-color: var(--primary);
    }
    .account-item.active .account-check::after {
      content: '✓';
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .account-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .account-empty .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.5;
    }
    .account-context {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-input);
    }
    .account-context strong {
      color: var(--text-primary);
    }

    .header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    /* 固定顶部区域 */
    .fixed-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
    }

    .header h2 {
      font-size: 22px;
      font-weight: 600;
    }

    /* 聊天容器 */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 24px 24px 24px;
      overflow-y: auto;
      min-height: 0;
    }

    /* 快捷指令 */
    .quick-commands {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
      padding: 0 0 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .quick-cmd {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quick-cmd:hover {
      background: var(--bg-input);
      color: var(--primary);
      border-color: var(--primary);
    }

    .quick-cmd svg {
      width: 14px;
      height: 14px;
    }

    /* 消息列表 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
      margin-bottom: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .message.ai .message-avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .message-content {
      max-width: 75%;
    }

    .message.user .message-content {
      text-align: right;
    }

    .message-text {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .message.user .message-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
      color: #fff;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* 消息中的代码块 */
    .message-text pre {
      background: var(--bg-input);
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      overflow-x: auto;
      font-size: 12px;
    }

    .message-text code {
      font-family: 'Monaco', 'Menlo', monospace;
    }

    /* 消息中的表格 */
    .message-text table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .message-text th,
    .message-text td {
      padding: 8px 12px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .message-text th {
      background: var(--bg-input);
    }

    /* ============ 任务卡片样式 ============ */
    .task-card {
      background: linear-gradient(135deg, #f0f4ff 0%, #f8f5ff 100%);
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 16px;
      max-width: 420px;
    }
    .task-card.loading {
      opacity: 0.7;
    }
    .task-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .task-card-icon { font-size: 18px; }
    .task-card-title {
      font-weight: 600;
      font-size: 15px;
      color: #1e1b4b;
      flex: 1;
    }
    .task-card-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 500;
    }
    .task-card-status.pending { background: #fef3c7; color: #92400e; }
    .task-card-status.in_progress { background: #dbeafe; color: #1e40af; }
    .task-card-status.completed { background: #d1fae5; color: #065f46; }
    .task-card-status.cancelled { background: #fee2e2; color: #991b1b; }
    .task-card-desc {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .task-card-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .task-progress-bar {
      flex: 1;
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }
    .task-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .task-progress-text {
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }
    .task-card-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .task-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #374151;
    }
    .task-item-row.completed { color: #059669; }
    .task-item-row.completed .task-item-dot { background: #10b981; }
    .task-item-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }
    .task-item-more {
      font-size: 12px;
      color: #9ca3af;
      padding-left: 14px;
    }
    .task-card-actions {
      display: flex;
      justify-content: flex-end;
    }
    .task-card-btn {
      font-size: 13px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(102,126,234,0.08);
      transition: background 0.2s;
    }
    .task-card-btn:hover { background: rgba(102,126,234,0.15); }

    /* 输入区域 */
    .input-area {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border);
      align-items: flex-start;
      flex-shrink: 0;
      margin-top: auto;
    }

    /* 模型信息 */
    .model-selector {
      flex-shrink: 0;
      padding: 6px 12px;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border: 1px solid var(--primary);
      border-radius: 8px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 0;
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    .input-field:focus {
      outline: none;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
    }

    /* 上传按钮 */
    .upload-btn {
      width: 44px;
      height: 44px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      color: #6b7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .upload-btn:hover {
      background: #e5e7eb;
      color: #4b5563;
    }

    .upload-btn svg {
      width: 20px;
      height: 20px;
    }

    /* 已上传文件列表 */
    .uploaded-files {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .uploaded-file {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 20px;
      font-size: 12px;
      color: #0369a1;
    }

    .uploaded-file .file-icon {
      font-size: 14px;
    }

    .uploaded-file .remove-file {
      cursor: pointer;
      opacity: 0.7;
    }

    .uploaded-file .remove-file:hover {
      opacity: 1;
    }

    /* 工具栏按钮 */
    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toolbar-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e293b;
    }

    .toolbar-btn.primary {
      background: #fff;
      border: 1px solid #c7d2fe;
      color: #4f46e5;
    }

    .toolbar-btn.primary:hover {
      background: #eef2ff;
      border-color: #a5b4fc;
    }

    .toolbar-btn.accent {
      background: #4f46e5;
      border: none;
      color: #fff;
      padding: 6px 14px;
    }

    .toolbar-btn.accent:hover {
      background: #4338ca;
    }

    .toolbar-btn svg {
      width: 16px;
      height: 16px;
    }

    .toolbar-btn .badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toolbar-btn.primary {
      position: relative;
    }

    /* 空状态 */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      min-height: 300px;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      background: var(--bg-card);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .empty-icon svg {
      width: 40px;
      height: 40px;
      color: var(--primary);
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 400px;
    }

    /* 加载动画 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .toolbar .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .toolbar .filter-group label {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .toolbar .filter-group select {
      padding: 6px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      min-width: 160px;
    }

    .toolbar .filter-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message-content { max-width: 90%; }
      .quick-commands { gap: 8px; }
      .quick-cmd { padding: 6px 12px; font-size: 12px; }
      .right-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <div id="sidebar"></div>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 固定顶部区域 -->
      <div class="fixed-header">
        <div class="header">
          <div style="display: flex; align-items: center; gap: 16px;">
            <h2>AI指令中心</h2>
            <button onclick="startNewConversation()" class="quick-cmd" title="开始新对话" style="font-size: 12px; padding: 6px 12px;">
              ➕ 新对话
            </button>
          </div>
        </div>

        <!-- 历史记录面板 -->
        <div class="history-panel" id="historyPanel" style="display: none;">
          <div class="history-header">
            <h4>📜 历史记录</h4>
            <button onclick="closeHistoryPanel()" style="border: none; background: none; cursor: pointer; font-size: 18px;">×</button>
          </div>
          <div class="history-list" id="historyList">
            <div class="loading">加载中...</div>
          </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar" style="padding: 16px 24px; margin-bottom: 0; display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span id="currentStoreLabel" style="font-size: 13px; color: var(--text-secondary);">📍 未选择店铺</span>
          </div>
          <div class="toolbar-actions" style="display: flex; gap: 8px;">
            <button class="toolbar-btn" onclick="openHistoryPanel()" title="历史记录">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            </button>
            <button class="toolbar-btn primary" onclick="openTaskDrawer()" title="任务列表">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2z"/></svg>
              任务列表
              <span id="taskPendingBadge" class="badge-count" style="display: none;">0</span>
            </button>
          </div>
        </div>

        <!-- 快捷指令 -->
        <div class="quick-commands">
          <button class="quick-cmd" onclick="sendQuickCommand('分析本周广告表现')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            分析本周广告表现
          </button>
          <button class="quick-cmd" onclick="sendQuickCommand('找出ACOS超标的活动')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            找出ACOS超标的活动
          </button>
          <button class="quick-cmd" onclick="sendQuickCommand('推荐本周新增关键词')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            推荐本周新增关键词

          <button class="quick-cmd" onclick="sendQuickCommand('优化预算分配建议')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            优化预算分配建议
          </button>
          <button class="quick-cmd" onclick="sendQuickCommand('生成上周广告报告')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>
            生成上周广告报告
          </button>
        </div>
      </div>

      <!-- 滚动区域：消息列表和输入框 -->
      <div class="chat-container">
        <!-- 消息列表 -->
        <div class="messages" id="messages">
          <!-- 空状态 -->
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
              </svg>
            </div>
            <h3>欢迎使用 AI 指令中心</h3>
            <p>在这里您可以用自然语言查询广告数据、分析表现、获取优化建议。尝试输入您的问题，或点击快捷指令开始。</p>
          </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
          <div class="model-selector" id="modelInfo" style="display:none;">
            <span id="currentModelName"></span>
          </div>
          <textarea
            class="input-field"
            id="messageInput"
            placeholder="输入您的指令... (例如：帮我分析过去7天的广告表现)"
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          </button>
          <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.gif" style="display: none;" onchange="handleFileSelect(this.files)">
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- 右侧账户/店铺面板 -->
    <aside class="right-panel" id="rightPanel">
      <div class="right-panel-header">
        🏪 店铺账户
        <button class="sync-btn" id="syncStoresBtn" onclick="syncStores()" title="同步店铺">
          🔄
        </button>
      </div>
      <div class="account-list" id="accountList">
        <div class="account-empty">
          <div class="empty-icon">⏳</div>
          正在加载店铺...
        </div>
      </div>
      <div class="account-context" id="accountContext" style="display: none;">
        已选择: <strong id="selectedAccountName">--</strong>
      </div>
    </aside>
  </div>

  <script>
    // 不重新定义 API_BASE（task-list.js 已定义），使用独立变量名
    // 等待 DOM 完全加载后再调用 taskList（task-list.js 在底部引入）
    const AI_API_BASE = '/api'; // AI 相关 API 基础路径
    let messages = []; // 多轮对话历史
    let isTyping = false;
    let currentStoreId = '';
    let uploadedFiles = []; // 存储已上传的文件内容
    let lastAiResponse = ''; // 用于去重，记录上一次AI回复
    let conversationId = null; // 当前会话 ID（用于多轮对话）
    const MAX_HISTORY = 20; // 最多保留 20 轮对话历史

    // 初始化 - 延迟执行确保 task-list.js 已加载
    document.addEventListener('DOMContentLoaded', async function() {
      document.getElementById('messageInput').focus();
      // 显示当前使用的模型
      showCurrentModel();
      // 加载任务统计 - 延迟 100ms 确保 taskList 已初始化
      setTimeout(() => {
        if (window.taskList) {
          window.taskList.loadStats();
        }
      }, 100);
      // 加载店铺列表
      loadStores();
    });

    // 显示当前使用的模型（从后端 API 读取，优先级：SiliconFlow > OpenRouter > OpenAI）
    async function showCurrentModel() {
      const modelInfo = document.getElementById('modelInfo');
      const modelName = document.getElementById('currentModelName');

      try {
        // 从后端 API 读取（数据库是权威数据源）
        const response = await fetch('/api/agent/config');
        const result = await response.json();
        
        if (result.success && result.data.configured) {
          const model = result.data.model || 'unknown';
          const provider = result.data.provider || 'unknown';
          modelName.textContent = '🤖 ' + model;
          modelInfo.title = '当前 Provider: ' + provider;
          modelInfo.style.display = 'flex';
          
          // 同步更新 localStorage（保持一致性）
          const localConfig = JSON.parse(localStorage.getItem('apiConfig') || '{}');
          if (provider === 'SiliconFlow') {
            localConfig.siliconflow = localConfig.siliconflow || {};
            localConfig.siliconflow.model = model;
          } else if (provider === 'OpenRouter') {
            localConfig.openrouter = localConfig.openrouter || {};
            localConfig.openrouter.model = model;
          }
          localStorage.setItem('apiConfig', JSON.stringify(localConfig));
          return;
        }
      } catch (e) {
        console.log('从后端读取模型配置失败，使用本地存储');
      }
      
      // 降级：从 localStorage 读取
      try {
        const config = JSON.parse(localStorage.getItem('apiConfig') || '{}');
        const model = config.siliconflow?.model || config.openrouter?.model || config.openai?.model || 'openai/gpt-4o';
        const provider = config.siliconflow?.model ? 'SiliconFlow' : (config.openrouter?.model ? 'OpenRouter' : 'OpenAI');
        modelName.textContent = '🤖 ' + model;
        modelInfo.title = '当前 Provider: ' + provider;
        modelInfo.style.display = 'flex';
      } catch (e) {
        modelName.textContent = '🤖 openai/gpt-4o';
        modelInfo.style.display = 'flex';
      }
    }

    // 获取当前模型（从后端 API 读取）
    async function getCurrentModel() {
      try {
        const response = await fetch('/api/agent/config');
        const result = await response.json();
        if (result.success && result.data.model) {
          return result.data.model;
        }
      } catch (e) {
        console.log('从后端读取模型失败，使用本地存储');
      }
      
      // 降级：从 localStorage 读取
      try {
        const config = JSON.parse(localStorage.getItem('apiConfig') || '{}');
        return config.siliconflow?.model || config.openrouter?.model || config.openai?.model || 'openai/gpt-4o';
      } catch (e) {
        return 'openai/gpt-4o';
      }
    }

    // ============ 店铺/账户管理 ============
    let storesData = [];      // 缓存的店铺数据
    let selectedStore = null; // 当前选中的店铺

    // 从 API 加载店铺列表
    async function loadStores() {
      const listEl = document.getElementById('accountList');
      try {
        const res = await fetch('/api/lingxing/stores');
        const json = await res.json();
        if (json.success && json.data && json.data.length > 0) {
          storesData = json.data;
          renderStoreList(storesData);
          // 自动选中第一个
          if (storesData.length > 0) {
            selectStore(storesData[0].store_id || storesData[0].id);
          }
        } else {
          // API 没有数据，使用默认模拟数据
          storesData = [
            { store_id: 'store_us', store_name: '美国站', marketplace: 'Amazon.com', region: 'US' },
            { store_id: 'store_uk', store_name: '英国站', marketplace: 'Amazon.co.uk', region: 'UK' },
            { store_id: 'store_de', store_name: '德国站', marketplace: 'Amazon.de', region: 'DE' },
            { store_id: 'store_jp', store_name: '日本站', marketplace: 'Amazon.co.jp', region: 'JP' }
          ];
          renderStoreList(storesData);
          selectStore('store_us');
        }
      } catch (e) {
        console.log('加载店铺失败，使用默认数据:', e);
        storesData = [
          { store_id: 'store_us', store_name: '美国站', marketplace: 'Amazon.com', region: 'US' },
          { store_id: 'store_uk', store_name: '英国站', marketplace: 'Amazon.co.uk', region: 'UK' },
          { store_id: 'store_de', store_name: '德国站', marketplace: 'Amazon.de', region: 'DE' },
          { store_id: 'store_jp', store_name: '日本站', marketplace: 'Amazon.co.jp', region: 'JP' }
        ];
        renderStoreList(storesData);
        selectStore('store_us');
      }
    }

    // 渲染店铺列表到右侧面板
    function renderStoreList(stores) {
      const listEl = document.getElementById('accountList');
      if (!stores || stores.length === 0) {
        listEl.innerHTML = `
          <div class="account-empty">
            <div class="empty-icon">🏪</div>
            暂无店铺数据<br>
            <button onclick="syncStores()" style="margin-top:8px;padding:6px 12px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;">同步店铺</button>
          </div>`;
        return;
      }

      // 按 region 分组
      const groups = {};
      stores.forEach(s => {
        const region = s.region || '其他';
        if (!groups[region]) groups[region] = [];
        groups[region].push(s);
      });

      const regionNames = { US: '北美', UK: '欧洲', DE: '欧洲', FR: '欧洲', IT: '欧洲', ES: '欧洲', JP: '亚太', AU: '亚太', CA: '北美', MX: '北美' };

      let html = '';
      for (const [region, items] of Object.entries(groups)) {
        html += `<div class="account-group">
          <div class="account-group-label">${regionNames[region] || region}</div>`;
        items.forEach(s => {
          const sid = s.store_id || s.id;
          const name = s.store_name || s.name || sid;
          const market = s.marketplace || '';
          const isActive = selectedStore && (selectedStore.store_id === sid || selectedStore.id === sid);
          html += `
            <div class="account-item ${isActive ? 'active' : ''}" data-store-id="${sid}" onclick="selectStore('${sid}')">
              <div class="account-icon">${name.charAt(0)}</div>
              <div class="account-info">
                <div class="account-name">${name}</div>
                <div class="account-meta">${market}</div>
              </div>
              <div class="account-check"></div>
            </div>`;
        });
        html += '</div>';
      }
      listEl.innerHTML = html;
    }

    // 选中店铺
    function selectStore(storeId) {
      const store = storesData.find(s => (s.store_id || s.id) === storeId);
      if (!store) return;
      selectedStore = store;
      currentStoreId = storeId;

      // 更新 UI 选中状态
      document.querySelectorAll('.account-item').forEach(el => {
        el.classList.toggle('active', el.dataset.storeId === storeId);
      });

      // 更新顶部标签
      const name = store.store_name || store.name || storeId;
      document.getElementById('currentStoreLabel').textContent = '📍 ' + name;
      document.getElementById('accountContext').style.display = 'block';
      document.getElementById('selectedAccountName').textContent = name;
    }

    // 同步店铺（从领星 API 拉取）
    async function syncStores() {
      const btn = document.getElementById('syncStoresBtn');
      btn.classList.add('spinning');
      try {
        const res = await fetch('/api/lingxing/stores?sync=1', { method: 'POST' });
        const json = await res.json();
        if (json.success) {
          showToast('店铺同步成功', 'success');
          await loadStores();
        } else {
          showToast('同步失败: ' + (json.message || '未知错误'), 'error');
        }
      } catch (e) {
        showToast('同步失败', 'error');
      } finally {
        btn.classList.remove('spinning');
      }
    }

    // 获取店铺名称（兼容旧代码）
    function getStoreName(storeId) {
      const s = storesData.find(x => (x.store_id || x.id) === storeId);
      if (s) return s.store_name || s.name || storeId;
      const fallback = { store_us: '美国站', store_uk: '英国站', store_de: '德国站', store_jp: '日本站' };
      return fallback[storeId] || storeId;
    }

    // 构建店铺上下文信息，自动附加到AI请求中
    function buildStoreContext(store) {
      const parts = [];
      if (store.marketplace) parts.push(`站点: ${store.marketplace}`);
      if (store.region) parts.push(`区域: ${store.region}`);
      if (store.profile_id) parts.push(`Profile ID: ${store.profile_id}`);
      if (store.account_id) parts.push(`Account ID: ${store.account_id}`);
      if (store.currency) parts.push(`货币: ${store.currency}`);
      return parts.length > 0 ? `店铺信息: ${parts.join(', ')}` : '';
    }

    // 快捷指令
    function sendQuickCommand(command) {
      document.getElementById('messageInput').value = command;
      sendMessage();
    }

    // 处理文件选择
    async function handleFileSelect(files) {
      if (!files || files.length === 0) return;

      for (const file of files) {
        const fileExt = file.name.split('.').pop().toLowerCase();
        const allowedExts = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'csv', 'png', 'jpg', 'jpeg', 'gif'];

        if (!allowedExts.includes(fileExt)) {
          alert(`不支持的文件格式: .${fileExt}\n支持格式: ${allowedExts.join(', ')}`);
          continue;
        }

        try {
          let content = '';

          if (['png', 'jpg', 'jpeg', 'gif'].includes(fileExt)) {
            // 图片文件转换为 base64
            content = await readFileAsBase64(file);
            content = `[图片内容 - Base64编码，大小: ${formatFileSize(file.size)}]`;
          } else if (['xls', 'xlsx', 'csv'].includes(fileExt)) {
            // Excel/CSV 文件
            content = await readExcelFile(file);
          } else if (['doc', 'docx'].includes(fileExt)) {
            // Word 文件 - 简化处理，只提示不支持
            content = `[Word文档内容 - ${file.name} (${formatFileSize(file.size)})]\n注: Word文档已上传，请告诉AI直接分析此文件。`;
          } else if (fileExt === 'pdf') {
            // PDF 文件 - 简化处理
            content = `[PDF文档内容 - ${file.name} (${formatFileSize(file.size)})]\n注: PDF文档已上传，请告诉AI直接分析此文件。`;
          }

          uploadedFiles.push({
            name: file.name,
            size: file.size,
            type: fileExt,
            content: content
          });

          renderUploadedFiles();
        } catch (error) {
          console.error('读取文件失败:', error);
          alert(`读取文件失败: ${file.name}`);
        }
      }
    }

    // 读取文件为 Base64
    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 读取 Excel 文件（使用 SheetJS 库解析）
    function readExcelFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const data = new Uint8Array(e.target.result);
            let content = `[Excel文件内容 - ${file.name}]\n`;
            content += `文件大小: ${formatFileSize(file.size)}\n\n`;

            // 检查是否是 CSV
            if (file.name.endsWith('.csv')) {
              const text = new TextDecoder().decode(data);
              const lines = text.split('\n').slice(0, 100); // CSV 最多读取前 100 行
              content += '--- CSV 数据（前 100 行）---\n';
              content += lines.join('\n');
              if (text.split('\n').length > 100) {
                content += '\n...(更多行已省略)';
              }
              resolve(content);
              return;
            }

            // 尝试使用 SheetJS 解析 xlsx
            if (typeof XLSX !== 'undefined') {
              try {
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                let hasData = false;

                // 遍历所有工作表
                for (const sheetName of workbook.SheetNames) {
                  const worksheet = workbook.Sheets[sheetName];
                  // 转换为 CSV 格式（限制 200 行避免 token 超限）
                  let csvContent = XLSX.utils.sheet_to_csv(worksheet);
                  const lines = csvContent.split('\n').slice(0, 200);

                  if (lines.length > 1) { // 有表头和数据
                    hasData = true;
                    content += `=== 工作表: ${sheetName} ===\n`;
                    content += lines.join('\n');
                    if (csvContent.split('\n').length > 200) {
                      content += '\n...(更多行已省略，完整数据请分段上传)';
                    }
                    content += '\n\n';
                  }
                }

                if (hasData) {
                  resolve(content);
                } else {
                  // 工作表为空
                  content += '[注意：该 Excel 文件工作表为空或数据量极少]\n';
                  resolve(content);
                }
              } catch (xlsxErr) {
                console.log('SheetJS 解析失败，使用简化模式:', xlsxErr.message);
                content += '[Excel 解析失败，已将文件基本信息发送给 AI]\n';
                content += `文件名: ${file.name}\n`;
                resolve(content);
              }
            } else {
              // 没有 SheetJS 库，提示用户
              content += '[提示：建议上传 CSV 格式以获得更好的数据解析效果]\n';
              content += `文件名: ${file.name}\n`;
              resolve(content);
            }
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // 渲染已上传文件列表
    function renderUploadedFiles() {
      let container = document.getElementById('uploadedFilesContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'uploadedFilesContainer';
        container.className = 'uploaded-files';
        const inputArea = document.querySelector('.input-area');
        inputArea.parentNode.insertBefore(container, inputArea);
      }

      if (uploadedFiles.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      container.innerHTML = uploadedFiles.map((f, index) => {
        const icons = {
          'pdf': '📄', 'doc': '📝', 'docx': '📝',
          'xls': '📊', 'xlsx': '📊', 'csv': '📋',
          'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️', 'gif': '🖼️'
        };
        return `
          <div class="uploaded-file">
            <span class="file-icon">${icons[f.type] || '📎'}</span>
            <span>${f.name}</span>
            <span class="remove-file" onclick="removeUploadedFile(${index})">×</span>
          </div>
        `;
      }).join('');
    }

    // 移除已上传的文件
    function removeUploadedFile(index) {
      uploadedFiles.splice(index, 1);
      renderUploadedFiles();
    }

    // 发送消息（支持多轮对话）
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const model = await getCurrentModel(); // 从后端 API 获取当前模型

      if (!text && uploadedFiles.length === 0 || isTyping) return;

      // 如果有上传的文件，将文件内容拼接到查询中
      let fullQuery = text;
      if (uploadedFiles.length > 0) {
        const fileSummary = uploadedFiles.map(f => {
          return `[文件: ${f.name}]\n内容:\n${f.content}`;
        }).join('\n\n');
        fullQuery = `请分析以下文件内容：\n\n${fileSummary}\n\n${text || '请给出分析结果和建议。'}`;
      }

      // 自动附加当前选中的店铺/账户信息
      if (selectedStore) {
        const storeCtx = buildStoreContext(selectedStore);
        fullQuery = `[当前店铺: ${selectedStore.store_name || selectedStore.name || selectedStore.store_id}]\n${storeCtx}\n\n${fullQuery}`;
      }

      // 清空输入框
      input.value = '';
      input.style.height = 'auto';

      // 隐藏空状态
      document.getElementById('emptyState').style.display = 'none';

      // 添加用户消息到本地显示
      let displayText = text || '分析上传的文件';
      if (uploadedFiles.length > 0) {
        displayText += '\n\n📎 已上传文件：' + uploadedFiles.map(f => f.name).join(', ');
      }
      addMessage('user', displayText);

      // 保存用户消息到对话历史（用于多轮对话）
      messages.push({ role: 'user', content: fullQuery });

      // 限制历史长度
      if (messages.length > MAX_HISTORY * 2) {
        messages = messages.slice(-MAX_HISTORY * 2);
      }

      // 生成会话 ID（用于多轮对话）
      if (!conversationId) {
        conversationId = 'C' + Date.now().toString(36).toUpperCase();
      }

      // 显示加载状态
      showTyping();

      try {
        // 调用 /agent/chat 接口（支持多轮对话）
        const response = await fetch('/api/agent/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: fullQuery,
            sessionId: conversationId,
            storeId: currentStoreId,
            model: model
          })
        });

        const data = await response.json();
        hideTyping();

        if (data.success) {
          // 添加 AI 响应到对话历史
          if (data.response) {
            messages.push({ role: 'assistant', content: data.response });
            addMessage('ai', data.response + '\n\n---\n*模型: ' + model + '*');
          }
          // 清空上传的文件
          uploadedFiles = [];
          document.getElementById('fileInput').value = '';
          renderUploadedFiles();
          // 保存对话到历史（用于侧边栏历史记录列表）
          conversationHistory.saveConversation({
            id: conversationId,
            userQuery: text,
            aiResponse: data.response,
            model: model,
            storeId: currentStoreId
          });
          
          // 处理任务生成：检查响应中是否包含任务信息
          if (data.taskId) {
            console.log('AI生成了任务:', data.taskId);
            // 在对话中插入任务卡片
            addTaskCard(data.taskId);
            showToast(`AI已自动生成任务`, 'success');
            // 刷新任务列表徽章
            if (typeof taskList !== 'undefined') {
              taskList.loadStats();
            }
          }
        } else {
          // 提供更友好的错误提示和解决方案
          let errorMsg = data.error || data.message || '未知错误';
          let solution = '';
          
          if (errorMsg.includes('not available in your region') || errorMsg.includes('region')) {
            solution = `

---

💡 **解决方案**：
您选择的模型在当前地区不可用。请尝试以下方法：

1. 在「系统设置」中切换到 **SiliconFlow**（推荐，免费额度大）
2. 或者在 OpenRouter 中选择 **"openai/gpt-4o"** 等带有前缀的模型`;
          } else if (errorMsg.includes('API Key') || errorMsg.includes('api key')) {
            solution = `

---

💡 **解决方案**：
请在「系统设置」页面中配置 AI API Key`;
          } else if (errorMsg.includes('quota') || errorMsg.includes('credit')) {
            solution = `

---

💡 **解决方案**：
您的 API 账户额度不足，请前往对应的 API 提供商充值或切换到 SiliconFlow`;
          }

          addMessage('ai', `❌ 发生错误：${errorMsg}${solution}\n\n---\n*模型: ${getModelName(model)}*`);
        }
      } catch (error) {
        hideTyping();
        // 使用模拟响应（添加去重检查）
        const mockResponse = getMockResponse(text);
        if (mockResponse && mockResponse !== lastAiResponse) {
          lastAiResponse = mockResponse;
          addMessage('ai', mockResponse + '\n\n---\n*模型: ' + getModelName(model) + '*');
        }
      }
    }

    // 开始新对话
    function startNewConversation() {
      // 清空本地对话历史
      messages = [];
      conversationId = null;
      
      // 清空聊天显示
      const messagesContainer = document.getElementById('messages');
      if (messagesContainer) {
        messagesContainer.innerHTML = '';
      }
      
      // 显示空状态
      document.getElementById('emptyState').style.display = 'flex';
      
      // 清空上传的文件
      uploadedFiles = [];
      renderUploadedFiles();
      
      // 清空输入框
      const input = document.getElementById('messageInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      
      showToast('已开启新对话', 'success');
    }
    window.startNewConversation = startNewConversation;

    // 获取模型显示名称
    function getModelName(modelId) {
      const names = {
        // SiliconFlow 模型
        'Qwen/Qwen3-8B': 'Qwen3-8B (SF)',
        'Qwen/Qwen3-30B-A3B': 'Qwen3-30B (SF)',
        'Qwen/Qwen3-235B-A22B': 'Qwen3-235B (SF)',
        'deepseek-ai/DeepSeek-V3': 'DeepSeek-V3 (SF)',
        'deepseek-ai/DeepSeek-R1': 'DeepSeek-R1 (SF)',
        'THUDM/glm-4-9b-chat': 'GLM-4-9B (SF)',
        // OpenRouter 模型
        'openrouter/free': '自动选择',
        'google/gemma-4-31b-it': 'Gemma 4 31B',
        'openai/gpt-4o': 'GPT-4o',
        'openai/gpt-4o-mini': 'GPT-4o Mini',
        'anthropic/claude-3-5-sonnet': 'Claude 3.5',
        'anthropic/claude-3-opus': 'Claude 3 Opus',
        'google/gemini-pro-1.5': 'Gemini Pro',
        'meta-llama/llama-3-70b-instruct': 'Llama 3 70B',
        'mistralai/mixtral-8x7b-instruct': 'Mixtral 8x7B',
        'deepseek/deepseek-v4-flash': 'DeepSeek-V4',
        'deepseek/deepseek-chat-v3-0324': 'DeepSeek-V3'
      };
      return names[modelId] || modelId;
    }

    // 添加消息到列表
    function addMessage(type, text) {
      const messagesContainer = document.getElementById('messages');
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      messageDiv.innerHTML = `
        <div class="message-avatar">${type === 'ai' ? 'AI' : '我'}</div>
        <div class="message-content">
          <div class="message-text">${formatMessage(text)}</div>
          <div class="message-time">${time}</div>
        </div>
      `;

      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      messages.push({ type, text, time });
    }

    // 在对话中插入任务卡片
    async function addTaskCard(taskId) {
      const messagesContainer = document.getElementById('messages');
      const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      // 先显示加载状态
      const cardDiv = document.createElement('div');
      cardDiv.className = 'message ai task-card-msg';
      cardDiv.innerHTML = `
        <div class="message-avatar">📋</div>
        <div class="message-content">
          <div class="task-card loading" id="task-card-${taskId}">
            <div class="task-card-header">
              <span class="task-card-icon">⏳</span>
              <span class="task-card-title">正在创建任务...</span>
            </div>
          </div>
          <div class="message-time">${time}</div>
        </div>
      `;
      messagesContainer.appendChild(cardDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // 拉取任务详情
      try {
        const res = await fetch(`/api/tasks/${taskId}`);
        const json = await res.json();
        if (json.success && json.data) {
          const t = json.data;
          const items = t.items || [];
          const completed = items.filter(i => i.status === 'completed').length;
          const card = document.getElementById(`task-card-${taskId}`);
          if (card) {
            card.className = 'task-card';
            card.innerHTML = `
              <div class="task-card-header">
                <span class="task-card-icon">📋</span>
                <span class="task-card-title">${escapeHtml(t.name)}</span>
                <span class="task-card-status ${t.status}">${statusLabel(t.status)}</span>
              </div>
              <div class="task-card-desc">${escapeHtml(t.description || '')}</div>
              ${items.length > 0 ? `
                <div class="task-card-progress">
                  <div class="task-progress-bar">
                    <div class="task-progress-fill" style="width:${items.length ? (completed / items.length * 100) : 0}%"></div>
                  </div>
                  <span class="task-progress-text">${completed}/${items.length}</span>
                </div>
                <div class="task-card-items">
                  ${items.slice(0, 3).map(i => `
                    <div class="task-item-row ${i.status}">
                      <span class="task-item-dot"></span>
                      <span class="task-item-title">${escapeHtml(i.title)}</span>
                    </div>
                  `).join('')}
                  ${items.length > 3 ? `<div class="task-item-more">+${items.length - 3} 个子任务</div>` : ''}
                </div>
              ` : ''}
              <div class="task-card-actions">
                <a href="ai-tasks.html" target="_blank" class="task-card-btn">查看任务中心 →</a>
              </div>
            `;
          }
        }
      } catch (e) {
        console.error('加载任务卡片失败:', e);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function statusLabel(s) {
      const map = { pending: '待处理', in_progress: '进行中', completed: '已完成', cancelled: '已取消' };
      return map[s] || s;
    }

    // 格式化消息（支持换行和基本格式）
    function formatMessage(text) {
      return text
        .replace(/\n/g, '<br>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>');
    }

    // 显示加载状态
    function showTyping() {
      isTyping = true;
      document.getElementById('sendBtn').disabled = true;
      
      const messagesContainer = document.getElementById('messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerHTML = `
        <div class="message-avatar">AI</div>
        <div class="message-content">
          <div class="message-text">
            <div class="typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>
      `;
      
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 隐藏加载状态
    function hideTyping() {
      isTyping = false;
      document.getElementById('sendBtn').disabled = false;
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    // 处理键盘事件
    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // 自动调整输入框高度
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    // 历史记录面板
    async function openHistoryPanel() {
      const panel = document.getElementById('historyPanel');
      panel.style.display = 'block';
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '<div class="loading">加载中...</div>';
      await conversationHistory.loadHistory(20);
      conversationHistory.renderHistoryList('historyList', 'loadConversation');
    }

    function closeHistoryPanel() {
      document.getElementById('historyPanel').style.display = 'none';
    }

    // 任务筛选
    async function filterTasks(status, btn) {
      // 更新按钮状态
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 更新筛选参数
      document.getElementById('taskStatusFilter').value = status;
      await refreshTaskList();
    }

      }
      
      if (lowerQuery.includes('预算') || lowerQuery.includes('分配')) {
        return `## 💰 预算分配建议

      }
      
      if (lowerQuery.includes('报告')) {
        return `## 📋 广告周报
