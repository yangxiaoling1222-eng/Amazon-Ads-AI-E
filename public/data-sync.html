<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据同步 - 亚马逊广告AI专家平台</title>
  <script src="js/auth-check.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components/sidebar.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    
    .layout {
      display: flex;
      min-height: 100vh;
    }
    
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 24px;
    }
    
    .page-header {
      margin-bottom: 24px;
    }
    
    .page-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    
    .page-header p {
      color: #666;
      font-size: 14px;
    }
    
    .sync-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1400px) {
      .sync-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .sync-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .sync-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.3s;
    }
    
    .sync-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    
    .sync-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .sync-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    
    .icon-stores { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .icon-products { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .icon-campaigns { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .icon-report { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    
    .sync-card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
    }
    
    .sync-card-desc {
      font-size: 13px;
      color: #888;
      margin-top: 2px;
    }
    
    .sync-card-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
    }
    
    .status-dot.success { background: #52c41a; }
    .status-dot.error { background: #ff4d4f; }
    .status-dot.loading { background: #1890ff; animation: pulse 1s infinite; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .sync-card-actions {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn-primary {
      background: #1890ff;
      color: #fff;
    }
    
    .btn-primary:hover {
      background: #40a9ff;
    }
    
    .btn-primary:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    /* 同步日志 */
    .sync-log {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    
    .sync-log h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .log-list {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .log-item:last-child {
      border-bottom: none;
    }
    
    .log-time {
      font-size: 12px;
      color: #999;
      min-width: 140px;
    }
    
    .log-type {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .log-type.success { background: #f6ffed; color: #52c41a; }
    .log-type.error { background: #fff2f0; color: #ff4d4f; }
    .log-type.info { background: #e6f7ff; color: #1890ff; }
    
    .log-message {
      flex: 1;
      font-size: 13px;
      color: #333;
    }
    
    .empty-log {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    /* Toast 通知 */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    
    .toast.success { background: #52c41a; }
    .toast.error { background: #ff4d4f; }
    .toast.info { background: #1890ff; }
    
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    /* 同步进度 */
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #f0f0f0;
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }
    
    .progress-bar.active {
      display: block;
    }
    
    .progress-fill {
      height: 100%;
      background: #1890ff;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }
    
    .progress-fill.complete { background: #52c41a; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <aside id="sidebar"></aside>
    
    <!-- 主内容 -->
    <main class="main-content">
      <div class="page-header">
        <h1>数据同步中心</h1>
        <p>从领星ERP同步店铺、产品、广告活动等数据</p>
      </div>
      
      <!-- 同步卡片 -->
      <div class="sync-grid">
        <!-- 店铺同步 -->
        <div class="sync-card">
          <div class="sync-card-header">
            <div class="sync-card-icon icon-stores">🏪</div>
            <div>
              <div class="sync-card-title">店铺数据</div>
              <div class="sync-card-desc">同步Amazon店铺信息</div>
            </div>
          </div>
          <div class="sync-card-status">
            <div class="status-dot" id="stores-status"></div>
            <span id="stores-status-text">未同步</span>
          </div>
          <div class="sync-card-actions">
            <button class="btn btn-primary" onclick="syncStores()">
              <span>🔄</span> 同步店铺
            </button>
            <button class="btn btn-secondary" onclick="viewStores()">查看</button>
          </div>
        </div>
        
        <!-- 产品同步 -->
        <div class="sync-card">
          <div class="sync-card-header">
            <div class="sync-card-icon icon-products">📦</div>
            <div>
              <div class="sync-card-title">产品数据</div>
              <div class="sync-card-desc">同步asin/sku产品信息</div>
            </div>
          </div>
          <div class="sync-card-status">
            <div class="status-dot" id="products-status"></div>
            <span id="products-status-text">未同步</span>
          </div>
          <div class="sync-card-actions">
            <button class="btn btn-primary" onclick="syncProducts()">
              <span>🔄</span> 同步产品
            </button>
            <button class="btn btn-secondary" onclick="viewProducts()">查看</button>
          </div>
        </div>
        
        <!-- 广告活动同步 -->
        <div class="sync-card">
          <div class="sync-card-header">
            <div class="sync-card-icon icon-campaigns">📢</div>
            <div>
              <div class="sync-card-title">广告活动</div>
              <div class="sync-card-desc">同步SP/SB/SD广告活动</div>
            </div>
          </div>
          <div class="sync-card-status">
            <div class="status-dot" id="campaigns-status"></div>
            <span id="campaigns-status-text">未同步</span>
          </div>
          <div class="sync-card-actions">
            <button class="btn btn-primary" onclick="syncCampaigns()">
              <span>🔄</span> 同步活动
            </button>
            <button class="btn btn-secondary" onclick="viewCampaigns()">查看</button>
          </div>
        </div>
        
        <!-- 报告同步 -->
        <div class="sync-card">
          <div class="sync-card-header">
            <div class="sync-card-icon icon-report">📊</div>
            <div>
              <div class="sync-card-title">广告报告</div>
              <div class="sync-card-desc">同步ACOS/曝光/点击数据</div>
            </div>
          </div>
          <div class="sync-card-status">
            <div class="status-dot" id="report-status"></div>
            <span id="report-status-text">未同步</span>
          </div>
          <div class="sync-card-actions">
            <button class="btn btn-primary" onclick="syncReport()">
              <span>🔄</span> 同步报告
            </button>
            <button class="btn btn-secondary" onclick="viewReport()">查看</button>
          </div>
        </div>
      </div>
      
      <!-- 同步日志 -->
      <div class="sync-log">
        <h3>📋 同步日志</h3>
        <div class="log-list" id="log-list">
          <div class="empty-log">暂无同步记录</div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Toast容器 -->
  <div id="toast-container"></div>
  
  <script src="components/sidebar.js"></script>
  <script>
    const API_BASE = '/api';
    
    // 当前用户模拟
    const currentUser = {
      id: 'U001',
      name: '系统管理员',
      role: 'admin'
    };
    
    // 同步状态
    const syncState = {
      stores: { status: 'pending', lastSync: null },
      products: { status: 'pending', lastSync: null },
      campaigns: { status: 'pending', lastSync: null },
      report: { status: 'pending', lastSync: null }
    };
    
    // 同步日志
    let syncLogs = [];
    
    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      loadSyncState();
      loadSyncLogs();
    });
    
    // 显示Toast
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }
    
    // 添加日志
    function addLog(type, message) {
      const now = new Date();
      const timeStr = now.toLocaleString('zh-CN');
      
      syncLogs.unshift({ type, message, time: timeStr });
      
      if (syncLogs.length > 50) syncLogs.pop();
      
      renderLogs();
      saveSyncLogs();
    }
    
    // 渲染日志
    function renderLogs() {
      const container = document.getElementById('log-list');
      
      if (syncLogs.length === 0) {
        container.innerHTML = '<div class="empty-log">暂无同步记录</div>';
        return;
      }
      
      container.innerHTML = syncLogs.map(log => `
        <div class="log-item">
          <span class="log-time">${log.time}</span>
          <span class="log-type ${log.type}">${log.type === 'success' ? '成功' : log.type === 'error' ? '失败' : '进行中'}</span>
          <span class="log-message">${log.message}</span>
        </div>
      `).join('');
    }
    
    // 更新状态显示
    function updateStatus(type, status, text) {
      const dot = document.getElementById(`${type}-status`);
      const textEl = document.getElementById(`${type}-status-text`);
      
      dot.className = 'status-dot';
      if (status === 'success') dot.classList.add('success');
      else if (status === 'error') dot.classList.add('error');
      else if (status === 'loading') dot.classList.add('loading');
      
      textEl.textContent = text;
      
      syncState[type].status = status;
      saveSyncState();
    }
    
    // 保存/加载同步状态
    function saveSyncState() {
      localStorage.setItem('syncState', JSON.stringify(syncState));
    }
    
    function loadSyncState() {
      const saved = localStorage.getItem('syncState');
      if (saved) {
        const state = JSON.parse(saved);
        Object.keys(state).forEach(key => {
          if (syncState[key]) {
            syncState[key] = state[key];
            const statusText = state[key].status === 'success' ? '已同步' : 
                              state[key].status === 'error' ? '同步失败' : '未同步';
            updateStatus(key, state[key].status, statusText);
          }
        });
      }
    }
    
    function saveSyncLogs() {
      localStorage.setItem('syncLogs', JSON.stringify(syncLogs));
    }
    
    function loadSyncLogs() {
      const saved = localStorage.getItem('syncLogs');
      if (saved) {
        syncLogs = JSON.parse(saved);
        renderLogs();
      }
    }
    
    // 获取认证头
    function getAuthHeaders() {
      const token = localStorage.getItem('sessionToken');
      return token ? { 'x-session-token': token } : {};
    }

    // 统一提取后端错误信息
    function getErrorMessage(data, fallback = '未知错误') {
      return data?.message || data?.error || fallback;
    }
    
    // 同步店铺
    async function syncStores() {
      updateStatus('stores', 'loading', '同步中...');
      addLog('info', '开始同步店铺数据...');
      
      try {
        const res = await fetch(`${API_BASE}/lingxing/stores`);
        console.log('[syncStores] 响应status:', res.status);
        const data = await res.json();
        console.log('[syncStores] 响应data:', JSON.stringify(data).slice(0, 200));
        
        if (res.status === 401) {
          const msg = getErrorMessage(data);
          updateStatus('stores', 'error', '需要重新登录');
          addLog('error', `店铺同步失败(${res.status}): ${msg}`);
          showToast(`请重新登录: ${msg}`, 'error');
          return;
        }
        
        if (data.success) {
          updateStatus('stores', 'success', `已同步 (${data.data.length || 0}个店铺)`);
          addLog('success', `店铺数据同步成功，共 ${data.data.length || 0} 个店铺`);
          showToast('店铺同步成功', 'success');
        } else {
          const msg = getErrorMessage(data);
          updateStatus('stores', 'error', '同步失败');
          addLog('error', `店铺同步失败: ${msg}`);
          showToast('店铺同步失败: ' + msg, 'error');
        }
      } catch (err) {
        updateStatus('stores', 'error', '网络错误');
        addLog('error', `店铺同步失败: ${err.message}`);
        showToast('网络错误，请检查服务是否运行', 'error');
      }
    }
    
    // 同步产品
    async function syncProducts() {
      updateStatus('products', 'loading', '同步中...');
      addLog('info', '开始同步产品数据...');
      
      try {
        const res = await fetch(`${API_BASE}/lingxing/products?pageSize=100`);
        const data = await res.json();
        
        if (data.success) {
          updateStatus('products', 'success', `已同步 (${data.data.length || 0}个产品)`);
          addLog('success', `产品数据同步成功，共 ${data.data.length || 0} 个产品`);
          showToast('产品同步成功', 'success');
        } else {
          const msg = getErrorMessage(data);
          updateStatus('products', 'error', '同步失败');
          addLog('error', `产品同步失败: ${msg}`);
          showToast('产品同步失败: ' + msg, 'error');
        }
      } catch (err) {
        updateStatus('products', 'error', '网络错误');
        addLog('error', `产品同步失败: ${err.message}`);
        showToast('网络错误，请检查服务是否运行', 'error');
      }
    }
    
    // 同步广告活动
    async function syncCampaigns() {
      updateStatus('campaigns', 'loading', '同步中...');
      addLog('info', '开始同步广告活动...');
      
      try {
        const res = await fetch(`${API_BASE}/lingxing/campaigns?pageSize=100`);
        const data = await res.json();
        
        if (data.success) {
          updateStatus('campaigns', 'success', `已同步 (${data.data.length || 0}个活动)`);
          addLog('success', `广告活动同步成功，共 ${data.data.length || 0} 个活动`);
          showToast('广告活动同步成功', 'success');
        } else {
          const msg = getErrorMessage(data);
          updateStatus('campaigns', 'error', '同步失败');
          addLog('error', `广告活动同步失败: ${msg}`);
          showToast('广告活动同步失败: ' + msg, 'error');
        }
      } catch (err) {
        updateStatus('campaigns', 'error', '网络错误');
        addLog('error', `广告活动同步失败: ${err.message}`);
        showToast('网络错误，请检查服务是否运行', 'error');
      }
    }
    
    // 同步报告
    async function syncReport() {
      updateStatus('report', 'loading', '同步中...');
      addLog('info', '开始同步广告报告数据...');
      
      try {
        // 获取最近7天的数据
        const endDate = new Date().toISOString().split('T')[0];
        const startDate = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        
        const res = await fetch(`${API_BASE}/lingxing/sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ startDate, endDate })
        });
        const data = await res.json();
        
        if (data.success) {
          updateStatus('report', 'success', '已同步');
          addLog('success', `广告报告同步成功 (${startDate} 至 ${endDate})`);
          showToast('报告同步成功', 'success');
        } else {
          const msg = getErrorMessage(data);
          updateStatus('report', 'error', '同步失败');
          addLog('error', `报告同步失败: ${msg}`);
          showToast('报告同步失败: ' + msg, 'error');
        }
      } catch (err) {
        updateStatus('report', 'error', '网络错误');
        addLog('error', `报告同步失败: ${err.message}`);
        showToast('网络错误，请检查服务是否运行', 'error');
      }
    }
    
    // 查看功能（跳转到对应页面）
    function viewStores() {
      window.location.href = 'system-logs.html';
    }

    function viewProducts() {
      window.location.href = 'system-logs.html';
    }

    function viewCampaigns() {
      window.location.href = 'system-logs.html';
    }

    function viewReport() {
      window.location.href = 'system-logs.html';
    }

    // 调试诊断
    async function runDebug() {
      const out = document.getElementById('debug-output');
      out.style.display = 'block';
      out.textContent = '正在诊断...\n';

      const token = localStorage.getItem('sessionToken');
      out.textContent += `1. localStorage token: ${token ? token.slice(0,8)+'...' : '无'}\n`;
      out.textContent += `2. window.fetch 被拦截: ${window.fetch.toString().includes('auth-check') ? '是' : '需检查'}\n`;

      try {
        // 测试1：直接调用debug端点
        out.textContent += '\n正在测试 /api/debug/headers...\n';
        const r1 = await fetch('/api/debug/headers');
        const d1 = await r1.json();
        out.textContent += `状态: ${r1.status}\n`;
        out.textContent += `服务端收到token: ${d1.token ? d1.token.slice(0,8)+'...' : '无'}\n`;
        out.textContent += `sessions中是否存在: ${d1.hasToken}\n`;

        // 测试2：调用stores接口（经过authMiddleware）
        out.textContent += '\n正在测试 /api/lingxing/stores...\n';
        const r2 = await fetch('/api/lingxing/stores');
        const d2 = await r2.json();
        out.textContent += `状态: ${r2.status}\n`;
        out.textContent += `success: ${d2.success}\n`;
        out.textContent += `message: ${d2.message || d2.error || '-'}\n`;
        out.textContent += `数据条数: ${d2.data?.length || 0}\n`;

      } catch(e) {
        out.textContent += `错误: ${e.message}\n`;
      }

      out.textContent += '\n✅ 诊断完成';
    }
  </script>
</body>
</html>
